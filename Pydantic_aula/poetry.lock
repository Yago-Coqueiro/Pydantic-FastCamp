version = "4.2.0"
description = "Camada de compatibilidade para bibliotecas assíncronas (essencial para o funcionamento do FastAPI)"
optional = false
python-versions = ">=3.8"

[package.dependencies]
idna = ">=2.8"
sniffio = ">=1.1"

[[package]]
